<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter WebApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="h-full bg-gradient-to-br from-indigo-50 via-white to-pink-50 flex items-center justify-center p-4">

    <div class="bg-white/80 backdrop-blur-md shadow-2xl rounded-3xl p-8 max-w-sm w-full border border-white/20 text-center transition-all duration-300 hover:shadow-3xl">
        
        <!-- App Header -->
        <div class="mb-8">
            <span class="text-xs font-semibold tracking-wider text-indigo-500 uppercase bg-indigo-50 px-3 py-1 rounded-full">Interactive Tool</span>
            <h1 class="text-2xl font-bold text-gray-800 mt-2">Counter App</h1>
            <p class="text-sm text-gray-500 mt-1">Tap buttons below to adjust the count</p>
        </div>

        <!-- Counter Display -->
        <div class="mb-8 bg-gray-50/50 rounded-2xl p-6 border border-gray-100 shadow-inner">
            <span id="counterValue" class="text-6xl font-extrabold text-indigo-600 transition-all duration-150 inline-block transform">0</span>
        </div>

        <!-- Controls / Buttons -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <button onclick="decrement()" class="bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-rose-500/30 transition-all duration-200 flex items-center justify-center text-xl">
                -
            </button>
            <button onclick="resetCounter()" class="bg-gray-200 hover:bg-gray-300 active:scale-95 text-gray-700 font-medium py-3 px-4 rounded-xl shadow transition-all duration-200 text-sm flex items-center justify-center">
                Reset
            </button>
            <button onclick="increment()" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-emerald-500/30 transition-all duration-200 flex items-center justify-center text-xl">
                +
            </button>
        </div>

        <!-- Step Increment Settings -->
        <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-100">
            <span class="text-xs font-medium text-gray-500">Step Value:</span>
            <div class="flex gap-1">
                <button onclick="setStep(1)" id="step1" class="step-btn px-2.5 py-1 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition-all">1</button>
                <button onclick="setStep(5)" id="step5" class="step-btn px-2.5 py-1 text-xs font-semibold rounded-lg bg-white text-gray-600 border border-gray-200 transition-all">5</button>
                <button onclick="setStep(10)" id="step10" class="step-btn px-2.5 py-1 text-xs font-semibold rounded-lg bg-white text-gray-600 border border-gray-200 transition-all">10</button>
            </div>
        </div>

    </div>

    <script>
        let count = 0;
        let step = 1;

        const counterDisplay = document.getElementById('counterValue');

        function updateDisplay() {
            counterDisplay.textContent = count;
            
            // Dynamic color highlights
            if (count > 0) {
                counterDisplay.className = "text-6xl font-extrabold text-emerald-600 transition-all duration-150 inline-block transform scale-105";
            } else if (count < 0) {
                counterDisplay.className = "text-6xl font-extrabold text-rose-600 transition-all duration-150 inline-block transform scale-105";
            } else {
                counterDisplay.className = "text-6xl font-extrabold text-indigo-600 transition-all duration-150 inline-block transform scale-100";
            }

            // Quick bounce effect reset
            setTimeout(() => {
                counterDisplay.classList.remove('scale-105');
            }, 150);
        }

        function increment() {
            count += step;
            updateDisplay();
        }

        function decrement() {
            count -= step;
            updateDisplay();
        }

        function resetCounter() {
            count = 0;
            updateDisplay();
        }

        function setStep(val) {
            step = val;
            // Update button styles
            document.querySelectorAll('.step-btn').forEach(btn => {
                btn.className = "step-btn px-2.5 py-1 text-xs font-semibold rounded-lg bg-white text-gray-600 border border-gray-200 transition-all";
            });
            const activeBtn = document.getElementById(`step${val}`);
            activeBtn.className = "step-btn px-2.5 py-1 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition-all shadow-sm";
        }
    </script>

</body>
</html>
